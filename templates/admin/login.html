{{template "_head_admin" .}}
<body>
<div class="admin-login-page">
  <div class="admin-login-card">
    <div class="admin-login-title">Summer Party 2026</div>
    <h1 class="admin-login-subtitle">Admin</h1>

    {{if .Error}}
    <div class="alert alert-error">Invalid credentials.</div>
    {{end}}

    <form class="admin-login-form" method="POST" action="/admin/login">
      {{template "_csrf" $}}
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
  </div>
</div>
</body>
</html>
