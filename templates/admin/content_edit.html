{{template "_head_admin" .}}
<body>
<div class="admin-layout">
{{template "_admin_topbar" .}}
<main class="admin-main">

  <div class="page-header">
    <div>
      <h1 class="page-title">{{.Block.Label}}</h1>
      <p class="page-subtitle"><code style="color:var(--accent)">{{.Block.Key}}</code></p>
    </div>
    <a href="/admin/content" class="btn btn-ghost">← Back</a>
  </div>

  <form class="admin-form wide" method="POST" action="/admin/content/{{.Block.Key}}">
    <div class="field">
      <label for="body_de">Deutsch (DE)</label>
      <textarea id="body_de" name="body_de" rows="10" placeholder="Markdown supported…">{{.Block.BodyDE}}</textarea>
      <span class="form-hint">Shown to guests with language set to DE (default)</span>
    </div>

    <div class="field">
      <label for="body_en">English (EN)</label>
      <textarea id="body_en" name="body_en" rows="10" placeholder="Markdown supported…">{{.Block.BodyEN}}</textarea>
      <span class="form-hint">Shown when guest switches to EN. Falls back to DE if empty.</span>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="/admin/content" class="btn btn-ghost">Cancel</a>
    </div>
  </form>

</main>
</div>
</body>
</html>
